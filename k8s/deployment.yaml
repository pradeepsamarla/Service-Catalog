apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm-service-flow
  labels:
    app.kubernetes.io/name: itsm-service-flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: itsm-service-flow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itsm-service-flow
    spec:
      containers:
        - name: web
          # Replace with your registry image, e.g. ghcr.io/pradeepsamarla/itsm-service-flow:0.1.0
          image: itsm-service-flow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
